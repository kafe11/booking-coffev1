name: Upgrade Laravel Framework

on:
  push:
    branches:
      - automation/laravel-framework-12-56
    paths:
      - ".github/workflows/laravel-framework-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: automation/laravel-framework-12-56

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: curl, dom, mbstring, pdo_sqlite, sqlite3, xml, zip

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Update Laravel framework constraint
        run: composer require "laravel/framework:^12.56" --no-interaction --no-update

      - name: Resolve and install updated dependencies
        run: composer update laravel/framework --with-all-dependencies --no-interaction --prefer-dist

      - name: Verify installed Laravel version
        run: php artisan --version

      - name: Create pull request with dependency updates
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/laravel-framework-12-56
          base: main
          title: "chore: upgrade Laravel framework to ^12.56"
          commit-message: "chore: upgrade Laravel framework to ^12.56"
          body: |
            ## Summary
            - Update the Laravel framework constraint to `^12.56`.
            - Regenerate `composer.lock` with compatible dependencies.

            ## Validation
            - Composer configuration validation
            - Dependency resolution via Composer
            - Laravel Artisan version check

            Please review the dependency changes and run the application's full test suite before merging.
          add-paths: |
            composer.json
            composer.lock
